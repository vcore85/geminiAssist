plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    compileSdk 35
    namespace 'io.github.acidefluorhydrique.geminiassist'
    ndkVersion '26.3.11579264'
    android.buildFeatures.buildConfig true
    defaultConfig {
        applicationId "io.github.acidefluorhydrique.geminiassist"
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName "1.5"
    }

    buildTypes {
        debug {
            //Installs next to the release build (F-Droid, GitHub) instead of replacing it
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    dependenciesInfo {
        //Google-encrypted dependency metadata is useless to F-Droid and other non-Play stores
        includeInApk = false
        includeInBundle = false
    }

    lint {
        disable 'MissingTranslation' // Translation is crowd-sourced, so this lint warning is useless
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "geminiassist-pcli-${variant.versionName}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.github.woheller69:FreeDroidWarn:V1.12'
}
